<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Folha de Pagamento 2026</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0b1120">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Folha 2026">

<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",sans-serif;
  background-color:#f8fafc;
  background-image:radial-gradient(#cbd5e1 1px, transparent 1px);
  background-size:24px 24px;
  padding:3rem 1.5rem;
  min-height:100vh;
  color:#0f172a;
  display:flex;
  align-items:center;
  justify-content:center;
}

.glass-master{
  max-width:1100px;
  width:100%;
  background:#ffffff;
  border-radius:1.5rem;
  box-shadow:0 25px 50px -12px rgba(15,23,42,.08);
  border:1px solid #e2e8f0;
  overflow:hidden;
}

.hero{
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
  padding:2.5rem;
  border-bottom:4px solid #2563eb;
}

.badge-smart{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(59,130,246,.15);
  border:1px solid rgba(59,130,246,.3);
  border-radius:60px;
  padding:.35rem 1rem;
  font-size:.75rem;
  font-weight:600;
  color:#60a5fa;
  margin-bottom:1rem;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.hero h1{
  font-size:2.2rem;
  font-weight:800;
  color:white;
  margin-bottom:.4rem;
}

.hero p{
  color:#94a3b8;
}

.form-grid{
  padding:2.5rem;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:1.5rem;
}

.input-field{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.input-field label{
  font-weight:700;
  font-size:.75rem;
  text-transform:uppercase;
  color:#64748b;
}

input,select{
  background:#f8fafc;
  border:1.5px solid #e2e8f0;
  border-radius:.75rem;
  padding:.8rem 1rem;
  font-size:.95rem;
  font-weight:500;
  width:100%;
}

input:focus,select:focus{
  background:#fff;
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,.12);
  outline:none;
}

.btn-elegant{
  margin:0 2.5rem 1rem;
  width:calc(100% - 5rem);
  background:#0f172a;
  border:none;
  padding:1.1rem;
  border-radius:.75rem;
  font-weight:700;
  font-size:.95rem;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
}

.btn-elegant:hover{
  background:#1e293b;
}

button.btn-elegant + button.btn-elegant{
  background:#f1f5f9;
  color:#475569;
  border:1px solid #cbd5e1;
}

button.btn-elegant + button.btn-elegant:hover{
  background:#e2e8f0;
  color:#0f172a;
}

/* Estilo para o terceiro botão sequencial (Limpar) manter o padrão secundário */
button.btn-elegant:nth-of-type(3) {
  background:#f1f5f9;
  color:#475569;
  border:1px solid #cbd5e1;
}
button.btn-elegant:nth-of-type(3):hover {
  background:#f87171;
  color:white;
  border-color:#ef4444;
}

.result-panel{
  padding:1.5rem 2.5rem 2.5rem;
  background:#f8fafc;
  border-top:1px solid #e2e8f0;
}

.result-card-clean{
  background:#fff;
  border-radius:1rem;
  border:1px solid #e2e8f0;
  overflow:hidden;
}

.result-title{
  padding:1.25rem 1.5rem;
  border-bottom:1px solid #f1f5f9;
}

.result-title h3{
  font-size:1.1rem;
  font-weight:700;
}

.result-lines{
  padding:.75rem 1.5rem;
}

.line-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:.9rem 0;
  border-bottom:1px solid #f1f5f9;
  font-size:.95rem;
}

.line-item span:first-child{
  color:#475569;
  font-weight:500;
}

.line-item span:last-child{
  font-weight:700;
  font-family:Consolas, monospace;
}

/* PROVENTOS */
.line-item.provento span:last-child{
  color:#16a34a;
}

/* DESCONTOS */
.line-item.desconto span:last-child{
  color:#dc2626;
}

/* TOTAIS */
.line-item.total{
  background:#f8fafc;
}

.line-item.total span{
  font-weight:800 !important;
}

.total-liquid{
  background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%);
  border:1px solid #bbf7d0;
  margin-top:1.5rem;
  border-radius:.75rem;
  padding:1.1rem 1.25rem;
}

.total-liquid span:first-child{
  color:#166534 !important;
  font-weight:800 !important;
}

.total-liquid span:last-child{
  color:#15803d !important;
  font-size:1.4rem;
  font-weight:800 !important;
}

@media(max-width:760px){

  body{
    padding:1rem .5rem;
  }

  .hero{
    padding:2rem 1.5rem;
  }

  .hero h1{
    font-size:1.75rem;
  }

  .form-grid{
    padding:1.5rem;
  }

  .btn-elegant{
    margin:0 1.5rem 1rem;
    width:calc(100% - 3rem);
  }

  .result-panel{
    padding:1.5rem;
  }

}

</style>
</head>

<body>

<div class="glass-master">

<div class="hero">

<div class="badge-smart">
<i class="fas fa-gem"></i>
Folha 2026
</div>

<h1>Calculadora de Salário Líquido</h1>

<p>App instalável Android/iPhone + PDF</p>

</div>

<div class="form-grid">

<div class="input-field">
<label>Salário Contratual</label>
<input type="number" id="salarioContrato" value="3500">
</div>

<div class="input-field">
<label>Horas de Falta</label>
<select id="faltasHorasSelect">
<option value="0">0h</option>
<option value="4">4h</option>
<option value="8">8h</option>
<option value="16">16h</option>
<option value="24">24h</option>
<option value="32">32h</option>
</select>
</div>

<div class="input-field">
<label>Dias úteis</label>
<input type="number" id="diasUteis" value="22">
</div>

<div class="input-field">
<label>Dependentes</label>
<input type="number" id="dependentesQt" value="1">
</div>

<div class="input-field">
<label>Insalubridade</label>
<select id="insalubridadeOpt">
<option value="0">Nenhuma</option>
<option value="0.2">20%</option>
<option value="0.4">40%</option>
</select>
</div>

<div class="input-field">
<label>Adicional Noturno</label>
<select id="noturnoOpt">
<option value="0">Não</option>
<option value="0.2">20%</option>
</select>
</div>

<div class="input-field">
<label>Horas Extras</label>
<input type="number" id="horasExtraQ" value="0">
</div>

<div class="input-field">
<label>Percentual H.Extra</label>
<select id="extraPercOpt">
<option value="0">0%</option>
<option value="0.5">50%</option>
<option value="1">100%</option>
</select>
</div>

<div class="input-field">
<label>Consignado</label>
<input type="number" id="consignadoValor" value="0">
</div>

<div class="input-field">
<label>Adiantamento</label>
<input type="number" id="adiantamentoValor" value="0">
</div>

<div class="input-field">
<label>Vale Transporte</label>
<select id="vtOpcao">
<option value="0">Não</option>
<option value="1">6%</option>
</select>
</div>

<div class="input-field">
<label>Outros descontos</label>
<input type="number" id="outrosDescVal" value="0">
</div>

</div>

<button class="btn-elegant" onclick="calcularFolha()">
<i class="fas fa-chart-line"></i>
Calcular Salário
</button>

<button class="btn-elegant" onclick="baixarPDF()">
<i class="fas fa-file-pdf"></i>
Gerar PDF
</button>

<button class="btn-elegant" onclick="limparCampos()">
<i class="fas fa-trash-alt"></i>
Limpar Campos
</button>

<div class="result-panel">

<div class="result-card-clean" id="pdfArea">

<div class="result-title">
<h3>Resumo do Holerite</h3>
</div>

<div class="result-lines" id="dynamicResult"></div>

</div>

</div>

</div>

<script>

const SALARIO_MINIMO = 1621;

const formatMoney = (v)=>
v.toLocaleString('pt-BR',{
style:'currency',
currency:'BRL'
});

function calcINSS(bruto){

let valor=0;

if(bruto<=1621){
valor=bruto*0.075;
}
else if(bruto<=2902.84){
valor=(1621*0.075)+((bruto-1621)*0.09);
}
else{
valor=
(1621*0.075)+
((2902.84-1621)*0.09)+
((bruto-2902.84)*0.12);
}

return valor;

}

function calcularFolha(){

const salario=
parseFloat(document.getElementById('salarioContrato').value)||0;

const faltas=
parseFloat(document.getElementById('faltasHorasSelect').value)||0;

const dias=
parseFloat(document.getElementById('diasUteis').value)||22;

const dependentes=
parseFloat(document.getElementById('dependentesQt').value)||0;

const insalubridadePerc=
parseFloat(document.getElementById('insalubridadeOpt').value)||0;

const noturno=
parseFloat(document.getElementById('noturnoOpt').value)||0;

const horasExtras=
parseFloat(document.getElementById('horasExtraQ').value)||0;

const extraPerc=
parseFloat(document.getElementById('extraPercOpt').value)||0;

const consignado=
parseFloat(document.getElementById('consignadoValor').value)||0;

const adiantamento=
parseFloat(document.getElementById('adiantamentoValor').value)||0;

const vt=
parseFloat(document.getElementById('vtOpcao').value)||0;

const outros=
parseFloat(document.getElementById('outrosDescVal').value)||0;

const horasMes=dias*8;

const valorHora=salario/horasMes;

const descontoFalta=valorHora*faltas;

const salarioBase=salario-descontoFalta;

const insalubridade=
SALARIO_MINIMO*insalubridadePerc;

const adicionalNoturno=
salarioBase*noturno;

const extraTotal=
(valorHora*horasExtras)+
((valorHora*horasExtras)*extraPerc);

const bruto=
salarioBase+
insalubridade+
adicionalNoturno+
extraTotal;

const inss=calcINSS(bruto);

const irrfBase=
bruto-
inss-
(dependentes*189.59);

const irrf=
irrfBase>5000
? irrfBase*0.275
:0;

const vale=
vt===1
? bruto*0.06
:0;

const descontos=
inss+
irrf+
vale+
consignado+
adiantamento+
outros;

const liquido=
bruto-descontos;

document.getElementById('dynamicResult').innerHTML=`

<div class="line-item">
<span>Salário Contratual</span>
<span>${formatMoney(salario)}</span>
</div>

<div class="line-item desconto">
<span>Desconto por Faltas</span>
<span>- ${formatMoney(descontoFalta)}</span>
</div>

<div class="line-item">
<span>Salário Base</span>
<span>${formatMoney(salarioBase)}</span>
</div>

<div class="line-item provento">
<span>Insalubridade</span>
<span>+ ${formatMoney(insalubridade)}</span>
</div>

<div class="line-item provento">
<span>Adicional Noturno</span>
<span>+ ${formatMoney(adicionalNoturno)}</span>
</div>

<div class="line-item provento">
<span>Horas Extras</span>
<span>+ ${formatMoney(extraTotal)}</span>
</div>

<div class="line-item total">
<span>Total de Proventos</span>
<span>${formatMoney(bruto)}</span>
</div>

<div class="line-item desconto">
<span>INSS</span>
<span>- ${formatMoney(inss)}</span>
</div>

<div class="line-item">
<span>Base IRRF</span>
<span>${formatMoney(irrfBase)}</span>
</div>

<div class="line-item desconto">
<span>IRRF</span>
<span>- ${formatMoney(irrf)}</span>
</div>

<div class="line-item desconto">
<span>Vale Transporte</span>
<span>- ${formatMoney(vale)}</span>
</div>

<div class="line-item desconto">
<span>Consignado</span>
<span>- ${formatMoney(consignado)}</span>
</div>

<div class="line-item desconto">
<span>Adiantamento</span>
<span>- ${formatMoney(adiantamento)}</span>
</div>

<div class="line-item desconto">
<span>Outros Descontos</span>
<span>- ${formatMoney(outros)}</span>
</div>

<div class="line-item total">
<span>Total Descontos</span>
<span>- ${formatMoney(descontos)}</span>
</div>

<div class="total-liquid line-item">
<span>SALÁRIO LÍQUIDO</span>
<span>${formatMoney(liquido)}</span>
</div>

`;

}

function baixarPDF(){

const elemento=
document.getElementById('pdfArea');

const opt={
margin:0.5,
filename:'holerite.pdf',
image:{
type:'jpeg',
quality:1
},
html2canvas:{
scale:2
},
jsPDF:{
unit:'in',
format:'a4',
orientation:'portrait'
}
};

html2pdf()
.set(opt)
.from(elemento)
.save();

}

function limparCampos() {
  document.getElementById('salarioContrato').value = "0";
  document.getElementById('faltasHorasSelect').value = "0";
  document.getElementById('diasUteis').value = "22";
  document.getElementById('dependentesQt').value = "0";
  document.getElementById('insalubridadeOpt').value = "0";
  document.getElementById('noturnoOpt').value = "0";
  document.getElementById('horasExtraQ').value = "0";
  document.getElementById('extraPercOpt').value = "0";
  document.getElementById('consignadoValor').value = "0";
  document.getElementById('adiantamentoValor').value = "0";
  document.getElementById('vtOpcao').value = "0";
  document.getElementById('outrosDescVal').value = "0";
  
  // Recalcula para atualizar a área visível do holerite com valores zerados
  calcularFolha();
}

window.addEventListener('DOMContentLoaded',()=>{
calcularFolha();
});

if('serviceWorker' in navigator){

window.addEventListener('load',()=>{

navigator.serviceWorker.register('./service-worker.js');

});

}

</script>

</body>
</html>
